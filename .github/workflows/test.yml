name: Test plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    name: Core / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py
  qgis:
    name: QGIS ${{ matrix.image }} / Qt reader
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['3.44', '4.0-trixie']
    steps:
      - uses: actions/checkout@v6
      - name: Run real QGIS tests without installing a browser engine
        env:
          QGIS_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/plugin -w /plugin \
            -e QGISLAB_REQUIRE_QGIS=1 \
            "qgis/qgis:$QGIS_IMAGE" \
            sh -c 'xvfb-run -a python3 -m unittest discover -s tests -v'
